<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Galeria -2048 favicon">
  <defs>
    <linearGradient id="borderGradient" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8ff00"/>
      <stop offset="0.30" stop-color="#00e6d8"/>
      <stop offset="0.52" stop-color="#00cfff"/>
      <stop offset="0.74" stop-color="#7559ff"/>
      <stop offset="0.88" stop-color="#e119ff"/>
      <stop offset="1" stop-color="#ff4f78"/>
    </linearGradient>

    <filter id="borderGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="whiteGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="12" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="15" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="12" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="inside">
      <rect x="31" y="31" width="450" height="450" rx="74"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#000"/>

  <rect x="28" y="28" width="456" height="456" rx="78" fill="#020405"/>

  <g clip-path="url(#inside)" stroke="#1e2427" stroke-width="1" opacity="0.72">
    <path d="M32 96H480 M32 160H480 M32 224H480 M32 288H480 M32 352H480 M32 416H480"/>
    <path d="M96 32V480 M160 32V480 M224 32V480 M288 32V480 M352 32V480 M416 32V480"/>
  </g>

  <rect x="28" y="28" width="456" height="456" rx="78" fill="none" stroke="#111619" stroke-width="12" opacity="0.7"/>
  <rect x="28" y="28" width="456" height="456" rx="78" fill="none" stroke="url(#borderGradient)" stroke-width="5" filter="url(#borderGlow)"/>

  <!-- minus -->
  <g filter="url(#whiteGlow)">
    <rect x="78" y="276" width="86" height="24" rx="6" fill="#ffffff" opacity="0.96"/>
    <rect x="84" y="282" width="74" height="12" rx="3" fill="#020405" opacity="0.75"/>
    <rect x="78" y="276" width="86" height="24" rx="6" fill="none" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- large 2, balanced and narrower at the top -->
  <g filter="url(#greenGlow)">
    <path d="M185 211
             C185 167 218 139 263 139
             C307 139 337 164 337 203
             C337 233 319 254 294 276
             L203 356
             C194 364 190 372 190 384
             L190 396
             L341 396"
          fill="none"
          stroke="#e8ff00"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M185 211
             C185 167 218 139 263 139
             C307 139 337 164 337 203
             C337 233 319 254 294 276
             L203 356
             C194 364 190 372 190 384
             L190 396
             L341 396"
          fill="none"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- superscript 11 -->
  <g filter="url(#cyanGlow)" stroke="#22ddff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M362 100 L382 80 L382 155" stroke-width="18"/>
    <path d="M414 100 L434 80 L434 155" stroke-width="18"/>
    <path d="M362 100 L382 80 L382 155" stroke="#ffffff" stroke-width="3"/>
    <path d="M414 100 L434 80 L434 155" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
